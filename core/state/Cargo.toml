[package]
name = "state"
version = "0.11.0"
edition = "2024"
publish = false
description = "Transactional state over an asynchronous key/value store: records and paged files, changed through a WAL that a flush makes durable atomically, copy-on-write in immutable zstd blobs"

[features]
default = []
simulation = []

[lib]
bench = false

[dependencies]
futures = "0.3"
bytes = "1.10"
# Blobs: zstd frames, a delta against its chunk's base as the reference prefix.
zstd-safe = { version = "7.2", default-features = false, features = ["std"] }
# Pinned with its subcrates in Cargo.lock: 0.22.4 to 0.22.6 print a debug line
# to stdout whenever a file device opens.
foyer = "=0.22.3"
# foyer's disk tier runs on tokio; the cache starts a small runtime when the host has none.
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
