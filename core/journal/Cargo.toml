[package]
name = "journal"
version = "0.11.0"
edition = "2024"
publish = false
description = "A durable journal over an asynchronous key/value store: records and paged files, committed together, with a log and checkpoints"

[features]
default = []
simulation = []

[lib]
bench = false

[dependencies]
futures = "0.3"
bytes = "1.10"
# Log segments: zstd frames against the previous images of their pages.
zstd-safe = { version = "7.2", default-features = false, features = ["std"] }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
# Pinned with its subcrates in Cargo.lock: 0.22.4 to 0.22.6 print a debug line
# to stdout whenever a file device opens.
foyer = "=0.22.3"
# foyer's disk tier runs on tokio; the cache starts a small runtime when the host has none.
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
