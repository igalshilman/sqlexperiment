# The Python workspace (uv), as pnpm-workspace.yaml is the TypeScript one:
# the sqlite-kv extension (sqlite-kv/), restate-fns (fns/), SQL in virtual
# objects over the Restate SDK, the agent integrations (agents/), and their
# tests (tests/). `make py` installs them
# into .venv; `make lint-py` checks them. The examples (../examples-python)
# are a project of their own, as yours would be.
[project]
name = "restate-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["restate-fns", "restate-agents", "hypercorn>=0.17"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "langgraph-checkpoint-conformance>=0.0.2"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sqlite-kv", "fns", "agents"]

[tool.uv.sources]
sqlite-kv = { workspace = true }
restate-fns = { workspace = true }
restate-agents = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
