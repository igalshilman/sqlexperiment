# The Python examples, each a file you run with `uv run`, after `make py` at
# the repository's root: the patched SDK and restate-agents, from the
# workspace around it (python/).
[project]
name = "examples"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["restate-agents", "restate-sdk", "sqlite-kv"]

[tool.uv]
package = false

[tool.uv.sources]
restate-agents = { path = "../agents", editable = true }
restate-sdk = { path = "../sdk/.build/sdk-python", editable = true }
sqlite-kv = { path = "../sqlite-kv", editable = true }
