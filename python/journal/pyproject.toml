[project]
name = "journal"
version = "0.1.0"
description = "SQL over a key/value store implemented in Python (native extension)"
requires-python = ">=3.10"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "journal._native"
python-source = "python"
features = ["pyo3/extension-module"]

# Rebuilt by `uv sync` when the Rust changes, its own or the crate's.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
  { file = "../../core/journal/Cargo.toml" },
  { file = "../../core/journal/src/**/*.rs" },
]
