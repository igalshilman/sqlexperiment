[package]
name = "sqlite-kv-python"
version = "0.1.0"
edition = "2024"
publish = false
description = "Python bindings: SQL over a key/value store the host implements in Python"

# Its own workspace: the binding stays out of the main crate's build.
[workspace]

[lib]
name = "sqlite_kv_python"
crate-type = ["cdylib"]

[dependencies]
journal = { path = "../../core/journal" }
# Its value type, as pinned by journal.
turso_core = { version = "=0.8.2", default-features = false, features = ["fs", "uuid", "json"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
bytes = "1.10"
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
