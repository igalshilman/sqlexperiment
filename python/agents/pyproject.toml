[project]
name = "restate-agents"
version = "0.1.0"
description = "Agent frameworks in Restate virtual objects, their state in the object's SQL database"
requires-python = ">=3.13"
dependencies = [
  "restate-sdk",
  "sqlite-kv",
  "hypercorn>=0.17",
  "langgraph>=1.2",
  "langchain-core>=1.6",
  "langchain-anthropic>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["restate_agents"]
