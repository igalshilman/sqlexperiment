[project]
name = "restate-agents"
version = "0.1.0"
description = "Agent frameworks in Restate virtual objects, their state in the object's SQL database"
requires-python = ">=3.13"
dependencies = [
  "restate-fns",
  "anthropic>=1.15",
  "hypercorn>=0.17",
  "langgraph>=1.2",
  "langchain-core>=1.6",
  "langchain-anthropic>=1.7",
  "langchain-openai>=1.1",
  "pydantic-ai-slim[anthropic]>=2.57", # TODO: and its openai extra, once LiteLLM takes openai 3 (FUTURE.md)
  "claude-agent-sdk>=0.2.172",
  "openai-codex-cli-bin>=0.163",
  "openai-agents>=0.20,<0.21", # TODO: 0.21 and later need openai 3, which litellm 1.106.2 does not take (FUTURE.md)
  # Exactly 1.106.2: 1.107.0 on PyPI was a credential stealer
  # (https://safedep.io/litellm-pypi-compromise-credential-stealer-backdoor/), and
  # 1.106.2 is the newest stable release the report lists as clean. Update by hand,
  # after checking the release.
  "litellm==1.106.2",
  "google-adk>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["restate_agents"]
