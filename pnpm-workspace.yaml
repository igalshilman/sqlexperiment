packages:
  - packages/*
  # restate-sessions' addon, a package per platform.
  - packages/sessions/npm/*
# Dependencies whose install scripts run (npm ran them all).
allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  # restate-server's usage analytics: not run.
  '@scarf/scarf': false
  esbuild: true
  protobufjs: true
  tree-sitter-bash: true
  tree-sitter-powershell: true
# Releases newer than pnpm's minimum age, taken on purpose: the Restate SDK.
minimumReleaseAgeExclude:
  - '@restatedev/restate-sdk-clients@1.18.1'
  - '@restatedev/restate-sdk-core@1.18.1'
  - '@restatedev/restate-sdk@1.18.1'
