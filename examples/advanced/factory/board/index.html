<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory board</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --line: #8884;
        --muted: #777;
        --glow: #3b6fd8;
        --good: #1f9d55;
        --ask: #d98b1c;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1b2027;
          --muted: #9aa3ad;
          --glow: #5b8cff;
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 140px 1fr auto;
        background: var(--bg);
      }
      nav {
        border-right: 1px solid var(--line);
        padding: 16px 8px;
        overflow-y: auto;
      }
      nav h1 {
        font-size: 18px;
        margin: 0 8px 12px;
      }
      .issue-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px;
        margin: 2px 0;
        border: 0;
        border-radius: 8px;
        background: none;
        font: inherit;
        cursor: pointer;
      }
      .issue-item.selected {
        background: var(--card);
        font-weight: 600;
      }
      .issue-item.working::after {
        content: ' ●';
        color: var(--glow);
        animation: pulse 1.2s infinite;
      }
      main {
        overflow: auto;
        padding: 24px 32px;
      }
      .empty {
        color: var(--muted);
      }
      .top,
      .lane {
        display: flex;
        align-items: center;
      }
      .top {
        margin-bottom: 32px;
      }
      .issue {
        width: 200px;
      }
      .issue .id {
        color: var(--muted);
      }
      .issue .title {
        font-size: 22px;
        font-weight: 600;
      }
      .lanes {
        display: grid;
        gap: 16px;
        padding-left: 24px;
        border-left: 3px solid var(--line);
      }
      .part {
        width: 200px;
        font-weight: 600;
      }
      .lane.approved .part::before {
        content: '✅ ';
      }
      .card {
        width: 300px;
        min-height: 92px;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }
      .card.idle {
        opacity: 0.45;
        cursor: default;
      }
      .card.working {
        border-color: var(--glow);
        animation: glow 1.6s ease-in-out infinite;
      }
      .card.open {
        outline: 3px solid var(--glow);
        outline-offset: 2px;
      }
      .card .role {
        font-weight: 600;
      }
      .card .key {
        color: var(--muted);
        font-size: 13px;
      }
      .card .doing {
        margin-top: 6px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .summary {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .link,
      .issue .link {
        display: inline-block;
        margin-top: 6px;
        color: var(--glow);
        font-weight: 600;
      }
      .card .verdict {
        margin-top: 6px;
        font-weight: 600;
      }
      .card .news {
        margin-top: 6px;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--ask);
        color: white;
        animation: pop 0.4s ease-out;
      }
      .edge {
        flex: 0 0 90px;
        height: 3px;
        margin: 0 8px;
        position: relative;
        background: var(--line);
      }
      .edge span {
        position: absolute;
        bottom: 8px;
        left: -20px;
        right: -20px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .edge.active {
        background: repeating-linear-gradient(90deg, var(--glow) 0 10px, transparent 10px 20px);
        background-size: 20px 3px;
        animation: flow 0.6s linear infinite;
      }
      @keyframes glow {
        50% {
          box-shadow: 0 0 18px var(--glow);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.2;
        }
      }
      @keyframes flow {
        to {
          background-position: 20px 0;
        }
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
      }
      #panel {
        width: 520px;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--card);
      }
      #panel[hidden] {
        display: none;
      }
      #panel header {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px;
        font-size: 14px;
      }
      .message.user {
        padding: 6px 10px;
        border-radius: 10px;
        background: var(--bg);
      }
      .message {
        margin: 8px 0;
      }
      .text {
        margin: 4px 0;
        white-space: pre-wrap;
      }
      .tool summary,
      .webhook summary {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        cursor: pointer;
      }
      .tool.error summary {
        color: #d33;
      }
      pre {
        margin: 4px 0;
        padding: 6px 8px;
        max-height: 240px;
        overflow: auto;
        border-radius: 6px;
        background: var(--bg);
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <nav>
      <h1>🏭 Factory</h1>
      <div id="issues"></div>
    </nav>
    <main id="board"></main>
    <aside id="panel" hidden>
      <header><span id="panel-title"></span><button id="close">✕</button></header>
      <div id="messages"></div>
    </aside>
    <script type="module" src="board.ts"></script>
  </body>
</html>
