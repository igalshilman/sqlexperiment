# The Python workspace (uv), as pnpm-workspace.yaml is the TypeScript one:
# the sqlite-kv extension (packages/sql-python). `make py` installs it into
# .venv, `make test-py` and `make lint-py` check it.
[project]
name = "restate-sql"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["sqlite-kv"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "mypy>=1.18"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/sql-python"]

[tool.uv.sources]
sqlite-kv = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/.build", "**/target", "sqlite-kv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
