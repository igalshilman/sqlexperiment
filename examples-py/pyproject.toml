# The Python examples, each a file you run with `uv run`, after `make py` at
# the repository's root: the patched SDK and restate-agents, from python/.
[project]
name = "examples-py"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["restate-agents", "restate-sdk", "sqlite-kv"]

[tool.uv]
package = false

[tool.uv.sources]
restate-agents = { path = "../python/agents", editable = true }
restate-sdk = { path = "../python/sdk/.build/sdk-python", editable = true }
sqlite-kv = { path = "../python/sqlite-kv", editable = true }
