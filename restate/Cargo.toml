[package]
name = "sqlite-kv-restate"
version = "0.1.0"
edition = "2024"
publish = false
description = "SQL in Restate virtual objects, over lazy state and without journal replay"

# Its own workspace: the patched SDK stays out of the main crate's build.
[workspace]

[dependencies]
sqlite-kv = { path = ".." }
restate-sdk = "=0.12.1"
bytes = "1.11"
futures = "0.3"
tokio = { version = "1", features = ["full"] }

# The vendored, patched SDK: see vendor/README.md.
[patch.crates-io]
restate-sdk = { path = "../vendor/rust/restate-sdk" }
restate-sdk-shared-core = { path = "../vendor/rust/restate-sdk-shared-core" }
restate-sdk-macros = { path = "../vendor/rust/restate-sdk-macros" }
