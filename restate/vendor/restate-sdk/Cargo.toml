    "tokio/net",
    "tokio/signal",
    "tokio/macros",
]
hyper = [
    "dep:hyper",
    "restate-sdk-shared-core/http",
]
lambda = [
    "dep:http-serde",
    "dep:lambda_runtime",
    "dep:aws_lambda_events",
]
rand = ["dep:rand"]
reqwest-client = ["dep:reqwest"]
